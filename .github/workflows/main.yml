name: Build Arcadium OG9 Clean APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub Ubuntu runners already contain the Android SDK.
      # Do not use the older android-actions/setup-android@v3:
      # it attempts to install the discontinued 'tools' SDK package.
      - name: Check project and Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/arcadium/og9/MainActivity.java
          test -f app/src/main/assets/index.html
          test -d "${ANDROID_HOME:?Android SDK not configured}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcadium-OG9-Clean-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
