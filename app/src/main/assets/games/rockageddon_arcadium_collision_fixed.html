let mode='menu',score=0,wave=1,lives=3,ship,rocks=[],bullets=[],particles=[],stars=[],powerups=[],time=0,last=0,spawnDelay=0,shieldTime=0,shake=0,combo=0;let keys={left:false,right:false,up:false,down:false,fire:false,thrust:false,shield:false,special:false};let fireCd=0,specialCd=0,shieldCd=0,shieldWasDown=false;const R=Math.random,TAU=Math.PI*2;const rand=(a,b)=>a+R()*(b-a);
for(let i=0;i<175;i++)stars.push({x:R()*720,y:R()*720,r:rand(.5,2),z:rand(.4,1.7),a:R()*6});
function init(){score=0;wave=1;lives=3;ship={x:360,y:400,vx:0,vy:0,a:-Math.PI/2,inv:2.5};rocks=[];bullets=[];particles=[];powerups=[];shieldTime=0;shieldCd=0;shieldWasDown=false;specialCd=0;fireCd=0;spawnWave();mode='play';ov.classList.add('hidden');updateHUD()}
function spawnWave(){for(let i=0;i<3+wave;i++){let x,y;do{x=R()*720;y=R()*720}while(Math.hypot(x-ship.x,y-ship.y)<170);rocks.push(makeRock(x,y,3))}shake=5}
function makeRock(x,y,size){let n=12,shape=Array.from({length:n},()=>rand(.76,1.16));return{x,y,size,r:size*20+11,vx:rand(-1.5,1.5)*(1+wave*.1),vy:rand(-1.5,1.5)*(1+wave*.1),rot:R()*TAU,vr:rand(-.013,.013),shape,heat:R(),cracks:Array.from({length:6},()=>({a:R()*TAU,l:rand(.25,.7)}))}}
function boom(x,y,count=25,col='#ff9c31',force=1){for(let i=0;i<count;i++){let a=R()*TAU,s=rand(1,6)*force;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(16,40),max:40,r:rand(1.5,4),col})}shake=Math.min(15,shake+count*.12)}
function splitRock(r){score+=({1:100,2:50,3:20})[r.size];combo++;boom(r.x,r.y,r.size*13,'#ff9d32',1.3);boom(r.x,r.y,12,'#66d9ff',1.5);if(r.size>1){for(let i=0;i<2;i++){let child=makeRock(r.x+rand(-10,10),r.y+rand(-10,10),r.size-1);child.vx+=i?2:-2;child.vy+=rand(-2,2);rocks.push(child)}}else if(R()<.09)powerups.push({x:r.x,y:r.y,life:550,type:R()<.6?'shield':'life'});updateHUD()}
function updateHUD(){document.getElementById('score').textContent='SCORE '+String(score).padStart(6,'0');document.getElementById('wave').textContent='WAVE '+String(wave).padStart(2,'0');document.getElementById('lives').textContent='♥ '.repeat(Math.max(0,lives))}
function wrap(o,margin=25){if(o.x< -margin)o.x=720+margin;if(o.x>720+margin)o.x=-margin;if(o.y< -margin)o.y=720+margin;if(o.y>720+margin)o.y=-margin}
function update(dt){time+=dt;stars.forEach(s=>s.a+=.015*dt);if(mode!=='play')return;if(keys.left)ship.a-=.065*dt;if(keys.right)ship.a+=.065*dt;if(keys.thrust||keys.up){ship.vx+=Math.cos(ship.a)*.23*dt;ship.vy+=Math.sin(ship.a)*.23*dt;if(R()<.9)for(let i=0;i<2;i++){let a=ship.a+Math.PI+rand(-.24,.24);particles.push({x:ship.x-Math.cos(ship.a)*20+Math.cos(ship.a+Math.PI/2)*(i?8:-8),y:ship.y-Math.sin(ship.a)*20+Math.sin(ship.a+Math.PI/2)*(i?8:-8),vx:Math.cos(a)*rand(3,8)+ship.vx*.3,vy:Math.sin(a)*rand(3,8)+ship.vy*.3,life:rand(10,22),max:22,r:rand(2,5),col:i?'#24dfff':'#2c76ff'})}}if(keys.down){ship.vx*=.95;ship.vy*=.95}ship.vx*=Math.pow(.994,dt);ship.vy*=Math.pow(.994,dt);ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;wrap(ship);ship.inv=Math.max(0,ship.inv-dt/60);shieldTime=Math.max(0,shieldTime-dt/60);shieldCd=Math.max(0,shieldCd-dt/60);fireCd-=dt;specialCd-=dt;
if(keys.fire&&fireCd<=0){let ax=Math.cos(ship.a),ay=Math.sin(ship.a);bullets.push({x:ship.x+ax*25,y:ship.y+ay*25,vx:ship.vx+ax*10,vy:ship.vy+ay*10,life:65});fireCd=10;boom(ship.x+ax*26,ship.y+ay*26,3,'#5feaff',.35)}if(keys.shield&&!shieldWasDown&&shieldCd<=0){shieldTime=2;shieldCd=10;boom(ship.x,ship.y,12,"#49cfff",.7)}shieldWasDown=keys.shield;if(keys.special&&specialCd<=0){specialCd=600;boom(ship.x,ship.y,80,'#27caff',4);for(let i=rocks.length-1;i>=0;i--)if(Math.hypot(rocks[i].x-ship.x,rocks[i].y-ship.y)<190){let r=rocks.splice(i,1)[0];splitRock(r)}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;wrap(b,0);if(b.life<=0){bullets.splice(i,1);continue}let hit=rocks.findIndex(r=>Math.hypot(r.x-b.x,r.y-b.y)<r.r*.88);if(hit>=0){let r=rocks.splice(hit,1)[0];bullets.splice(i,1);splitRock(r)}}for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.rot+=r.vr*dt;wrap(r,r.r);if(ship.inv<=0&&shieldTime<=0&&Math.hypot(ship.x-r.x,ship.y-r.y)<r.r*.72+13){lives--;ship.inv=1.5;boom(ship.x,ship.y,45,'#ff594a',2);ship.x=360;ship.y=360;ship.vx=ship.vy=0;updateHUD();if(lives<=0){mode='over';ov.style.backgroundImage='linear-gradient(#01071888,#010718bb),url('+poster.src+')';ov.classList.remove('hidden');play.textContent='RETRY • SCORE '+score}break}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=powerups.length-1;i>=0;i--){let p=powerups[i];p.life-=dt;if(Math.hypot(ship.x-p.x,ship.y-p.y)<30){if(p.type==='life')lives=Math.min(5,lives+1);else {shieldCd=0;shieldTime=2}powerups.splice(i,1);updateHUD()}else if(p.life<=0)powerups.splice(i,1)}if(!rocks.length){wave++;ship.inv=2;spawnWave();updateHUD()}shake*=.86}
function backdrop(){let bg=ctx.createRadialGradient(390,420,20,350,350,620);bg.addColorStop(0,'#103466');bg.addColorStop(.42,'#071a3e');bg.addColorStop(1,'#01040d');ctx.fillStyle=bg;ctx.fillRect(0,0,720,720);let neb=ctx.createRadialGradient(110,600,10,120,630,400);neb.addColorStop(0,'#2937a455');neb.addColorStop(1,'#00112200');ctx.fillStyle=neb;ctx.fillRect(0,0,720,720);for(let s of stars){ctx.globalAlpha=.3+.6*(.5+.5*Math.sin(s.a));ctx.fillStyle=s.z>1.2?'#9beaff':'#b4aaff';ctx.fillRect(s.x,s.y,s.r*s.z,s.r*s.z)}ctx.globalAlpha=1;ctx.strokeStyle='#0c315744';for(let i=0;i<720;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,720);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(720,i);ctx.stroke()}ctx.save();ctx.translate(590,775);ctx.rotate(-.25);let p=ctx.createRadialGradient(0,0,60,0,0,380);p.addColorStop(0,'#1974cb');p.addColorStop(.65,'#0a1b46');p.addColorStop(.99,'#06112b');p.addColorStop(1,'#68dcff');ctx.fillStyle=p;ctx.beginPath();ctx.arc(0,0,300,0,TAU);ctx.fill();ctx.restore()}
function drawRock(r){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);let rr=r.r;ctx.shadowBlur=12;ctx.shadowColor='#1b8dfc';ctx.beginPath();r.shape.forEach((s,i)=>{let a=i/r.shape.length*TAU,x=Math.cos(a)*rr*s,y=Math.sin(a)*rr*s;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.closePath();let g=ctx.createRadialGradient(-rr*.4,-rr*.5,1,0,0,rr*1.2);g.addColorStop(0,'#a4b6c3');g.addColorStop(.35,'#4b586b');g.addColorStop(.75,'#19273e');g.addColorStop(1,'#080e1d');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#70c5ff';ctx.stroke();ctx.shadowBlur=0;ctx.save();ctx.clip();for(let i=0;i<9;i++){let a=i*2.4+r.heat*3,x=Math.cos(a)*rr*.65,y=Math.sin(a)*rr*.65,rad=rr*randFixed(i)*.25;ctx.fillStyle='#0a1427aa';ctx.beginPath();ctx.ellipse(x,y,Math.max(2,rad),Math.max(2,rad*.6),a,0,TAU);ctx.fill();ctx.strokeStyle='#8a9eb155';ctx.stroke()}for(let c of r.cracks){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(c.a)*rr*c.l,Math.sin(c.a)*rr*c.l);ctx.lineWidth=randFixed(c.a*10)*3+1;ctx.strokeStyle='#ff752b';ctx.shadowColor='#ff4a0b';ctx.shadowBlur=13;ctx.stroke()}ctx.restore();ctx.restore()}
function randFixed(x){return .35+.65*Math.abs(Math.sin(x*78.233))}
function drawShip(){ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a+Math.PI/2);if(ship.inv>0&&Math.floor(time/5)%2===0)ctx.globalAlpha=.48;ctx.shadowBlur=25;ctx.shadowColor='#13baff';ctx.fillStyle='#071c43';ctx.strokeStyle='#8de8ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(12,-8);ctx.lineTo(23,17);ctx.lineTo(11,13);ctx.lineTo(7,22);ctx.lineTo(-7,22);ctx.lineTo(-11,13);ctx.lineTo(-23,17);ctx.lineTo(-12,-8);ctx.closePath();ctx.fill();ctx.stroke();let g=ctx.createLinearGradient(-20,-20,20,20);g.addColorStop(0,'#f9ffff');g.addColorStop(.25,'#5cc9ff');g.addColorStop(.6,'#2868ad');g.addColorStop(1,'#eef9ff');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(8,-3);ctx.lineTo(5,14);ctx.lineTo(-5,14);ctx.lineTo(-8,-3);ctx.closePath();ctx.fill();ctx.fillStyle='#ff4e39';ctx.fillRect(-20,7,7,8);ctx.fillRect(13,7,7,8);ctx.fillStyle='#021329';ctx.beginPath();ctx.ellipse(0,-5,5,10,0,0,TAU);ctx.fill();ctx.strokeStyle='#5beaff';ctx.stroke();if(keys.thrust||keys.up){for(let i of [-1,1]){let len=rand(18,43);let fg=ctx.createLinearGradient(0,15,0,15+len);fg.addColorStop(0,'#fff');fg.addColorStop(.3,'#27e8ff');fg.addColorStop(1,'#0962ff00');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(i*11-5,15);ctx.lineTo(i*11,15+len);ctx.lineTo(i*11+5,15);ctx.fill()}}ctx.restore();if(shieldTime>0){ctx.strokeStyle='#60d9ff';ctx.lineWidth=3;ctx.shadowBlur=20;ctx.shadowColor='#13ccff';ctx.beginPath();ctx.arc(ship.x,ship.y,35+Math.sin(time*.1)*2,0,TAU);ctx.stroke();ctx.shadowBlur=0}}
function draw(){ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));backdrop();if(mode!=='menu'){rocks.forEach(drawRock);for(let p of powerups){ctx.shadowColor='#00dfff';ctx.shadowBlur=18;ctx.strokeStyle='#74eaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,14,0,TAU);ctx.stroke();ctx.font='19px sans-serif';ctx.fillStyle='#fff';ctx.fillText(p.type==='life'?'♥':'◆',p.x-9,p.y+7);ctx.shadowBlur=0}for(let b of bullets){ctx.strokeStyle='#b7ffff';ctx.shadowColor='#00cfff';ctx.shadowBlur=18;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*1.8,b.y-b.vy*1.8);ctx.stroke();ctx.shadowBlur=0}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.shadowBlur=10;ctx.shadowColor=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;drawShip();if(mode==='pause'){ctx.fillStyle='#000b';ctx.fillRect(0,0,720,720);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 65px system-ui';ctx.fillText('PAUSED',360,360);ctx.textAlign='left'}}ctx.restore()}
function frame(t){let dt=Math.min(2.2,(t-last)/16.67||1);last=t;if(mode==='play')update(dt);else time+=dt;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
play.addEventListener('click',init);document.getElementById('restart').onclick=init;function pause(){if(mode==='play')mode='pause';else if(mode==='pause')mode='play'}document.getElementById('pause').onclick=pause;
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'fire',KeyZ:'shield',KeyX:'thrust',KeyS:'special',Space:'fire',ShiftLeft:'thrust',Enter:'pause',Escape:'pause'};document.addEventListener('keydown',e=>{let k=map[e.code];if(k){e.preventDefault();if(k==='pause'&&!e.repeat)pause();else keys[k]=true}});document.addEventListener('keyup',e=>{let k=map[e.code];if(k&&k!=='pause')keys[k]=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[k]=true;b.classList.add('pressed')};const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,up))});function poll(){let gp=navigator.getGamepads?.()?.find(x=>x);if(gp){let b=i=>!!gp.buttons[i]?.pressed;keys.left=b(14)||gp.axes[0]<-.4;keys.right=b(15)||gp.axes[0]>.4;keys.up=b(12);keys.down=b(13);keys.fire=b(0);keys.shield=b(1);keys.thrust=b(2)||b(7);keys.special=b(3);if(b(9)&&!poll.wasPause)pause();poll.wasPause=b(9)}requestAnimationFrame(poll)}requestAnimationFrame(poll);
