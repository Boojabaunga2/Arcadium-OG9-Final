<!doctype html><html lang="en"><head><script src="../controller.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ARCADIUM // NEON CYCLE RIOT</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#142447,#03050d 70%);color:#dcfaff;font-family:system-ui,Arial,sans-serif;text-align:center;touch-action:manipulation}header{padding:12px 4px 7px;font-weight:900;letter-spacing:3px;color:#6ceeff;text-shadow:0 0 18px #0af;font-size:clamp(14px,3.5vw,24px)}.wrap{max-width:720px;margin:auto;padding:0 7px 30px}canvas{display:block;width:100%;aspect-ratio:1;border:2px solid #39d9ff;border-radius:12px;box-shadow:0 0 22px #08a6ff55;background:#050915;touch-action:none}.deck{margin-top:14px;padding:15px 10px;background:linear-gradient(#222b42,#090d1a);border:2px solid #46536e;border-radius:35px;box-shadow:inset 0 4px 12px #ffffff15;display:flex;justify-content:space-around;align-items:center;gap:12px}.dpad{display:grid;grid-template-columns:repeat(3,53px);grid-template-rows:repeat(3,48px);gap:3px}.key,.act,.wide{background:linear-gradient(#28334c,#0b0e18);border:2px solid #66758f;color:white;font-weight:900;box-shadow:0 5px 0 #020309;user-select:none;touch-action:none;cursor:pointer}.key{border-radius:11px;font-size:22px}.key:active,.act:active,.wide:active,.pressed{background:#245c86!important;transform:translateY(3px);box-shadow:0 2px 0 #020309!important}.actions{display:grid;grid-template-columns:repeat(2,72px);gap:12px}.act{width:72px;height:72px;border-radius:50%;border-color:#e53b69;font-size:24px}.act small{display:block;font-size:9px;color:#aeeaff}.bottom{display:flex;justify-content:center;gap:14px;margin:17px 0}.wide{padding:12px 20px;border-radius:12px;border-color:#32c9ef;font-size:14px}.hint{font-size:12px;color:#8fa7c5;line-height:1.5}.swatches{display:flex;justify-content:center;gap:8px;margin:10px}.swatch{width:27px;height:27px;border-radius:50%;border:2px solid white;cursor:pointer;box-shadow:0 0 12px currentColor}.swatch.sel{outline:3px solid #fff;outline-offset:3px}@media(max-width:400px){.dpad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px)}.actions{grid-template-columns:repeat(2,60px);gap:8px}.act{width:60px;height:60px}.deck{padding:12px 5px}}</style></head><body><header>ARCADIUM // NEON CYCLE RIOT</header><div class="wrap"><canvas id="game" width="720" height="720"></canvas><div class="swatches" id="swatches"></div><div class="deck"><div class="dpad"><span></span><button class="key" data-dir="up">▲</button><span></span><button class="key" data-dir="left">◀</button><span></span><button class="key" data-dir="right">▶</button><span></span><button class="key" data-dir="down">▼</button><span></span></div><div class="actions"><button class="act" id="boost">A<small>BOOST</small></button><button class="act" id="ghost">B<small>GHOST</small></button></div></div><div class="bottom"><button class="wide" id="start">START / NEXT ROUND</button><button class="wide" id="pause">PAUSE</button></div><div class="hint">TOP-DOWN • 90° TURNS • REAL MOTORCYCLE SPRITES • 1, 3, 5, 7… BOTS<br>D-pad / arrows steer • A boost • B ghost • Enter start • P pause</div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');const W=720,H=720,C=30,R=27,S=22,OX=30,OY=91;const colors=['#ff344d','#21baff','#3dff6e','#ffe345','#f14cff','#f5faff','#ff8a24','#8b74ff','#14ffd3','#fa74b4','#a4ff25','#f8a95b'];let selected=0,round=1,lives=3,score=0,best=0,state='menu',riders=[],grid=[],particles=[],elapsed=0,clock=0,last=0,flash='',flashTime=0,camShake=0,boostHeld=false,ghostHeld=false,boostEnergy=100,ghostEnergy=100,backgroundStars=[];const dirs=[[0,-1],[1,0],[0,1],[-1,0]];for(let i=0;i<85;i++)backgroundStars.push({x:Math.random()*720,y:Math.random()*720,r:Math.random()*2+.3});const sw=document.getElementById('swatches');colors.slice(0,6).forEach((co,i)=>{const b=document.createElement('button');b.className='swatch'+(!i?' sel':'');b.style.background=co;b.style.color=co;b.title=['Red','Blue','Green','Yellow','Pink','White'][i];b.onclick=()=>{selected=i;document.querySelectorAll('.swatch').forEach((x,j)=>x.classList.toggle('sel',i===j));if(state==='menu')render(0)};sw.appendChild(b)});
function initGrid(){grid=Array.from({length:R},()=>Array(C).fill(-1))}function free(x,y){return x>=0&&x<C&&y>=0&&y<R&&grid[y][x]===-1}function distClear(x,y,d,limit=7){let n=0;for(let j=1;j<=limit;j++){if(!free(x+dirs[d][0]*j,y+dirs[d][1]*j))break;n++}return n}function makeRider(id,x,y,dir,color){return{id,x,y,px:x,py:y,dir,want:dir,color,alive:true,progress:0,step:id===0?.145:.19,trail:[{x,y}],ghost:0,boost:0,think:0}}function startRound(){initGrid();riders=[];particles=[];boostEnergy=100;ghostEnergy=100;elapsed=0;camShake=0;const count=round*2-1;const starts=[[15,22,0],[5,4,1],[24,4,3],[5,13,1],[24,13,3],[9,3,2],[20,3,2],[3,21,0],[26,21,0],[14,3,2],[3,9,1],[26,9,3],[8,19,0],[21,19,0],[3,3,1],[26,3,3],[3,17,1],[26,17,3],[14,14,0],[8,9,1],[21,9,3]];let [x,y,d]=starts[0];riders.push(makeRider(0,x,y,d,colors[selected]));grid[y][x]=0;for(let i=1;i<=count;i++){let p=starts[i%starts.length];let xx=p[0],yy=p[1];if(!free(xx,yy)){let found=false;for(let k=0;k<250;k++){xx=2+Math.floor(Math.random()*(C-4));yy=2+Math.floor(Math.random()*(R-4));if(free(xx,yy)){found=true;break}}if(!found)continue}const bot=makeRider(i,xx,yy,p[2],colors[(selected+i)%colors.length]);bot.step=Math.max(.105,.23-round*.007)+(i%3)*.012;riders.push(bot);grid[yy][xx]=i}state='playing';flash=`ROUND ${round}  •  ${count} BOT${count===1?'':'S'}`;flashTime=2.3}function choose(d){if(state==='menu'){startRound();return}if(state!=='playing')return;let p=riders[0];if(!p?.alive)return;if((d+2)%4!==p.dir)p.want=d}function togglePause(){if(state==='playing')state='paused';else if(state==='paused')state='playing'}function startButton(){if(state==='menu'||state==='lost'||state==='won'){if(state==='lost'){round=1;lives=3;score=0}startRound()}else if(state==='paused')state='playing'}document.getElementById('start').onclick=startButton;document.getElementById('pause').onclick=togglePause;document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();choose({up:0,right:1,down:2,left:3}[b.dataset.dir]);b.classList.add('pressed')});for(let event of ['pointerup','pointercancel','pointerleave'])b.addEventListener(event,()=>b.classList.remove('pressed'))});function bindHold(id,set){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();set(true);b.classList.add('pressed');b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>{set(false);b.classList.remove('pressed')}))}bindHold('boost',v=>boostHeld=v);bindHold('ghost',v=>ghostHeld=v);let keys={};window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','enter'].includes(key))e.preventDefault();if(!keys[key]){if(key==='arrowup'||key==='w')choose(0);if(key==='arrowright'||key==='d')choose(1);if(key==='arrowdown'||key==='s')choose(2);if(key==='arrowleft'||key==='a')choose(3);if(key==='enter')startButton();if(key==='p')togglePause()}keys[key]=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function pollGamepad(){const gps=navigator.getGamepads?.()||[];const g=Array.from(gps).find(Boolean);if(!g)return;const pressed=i=>g.buttons[i]?.pressed;const axes=g.axes||[];const d=[pressed(12)||axes[1]<-.55,pressed(15)||axes[0]>.55,pressed(13)||axes[1]>.55,pressed(14)||axes[0]<-.55];for(let i=0;i<4;i++)if(d[i])choose(i);boostHeld=pressed(0);ghostHeld=pressed(1);if(pressed(9)&&!keys.padstart){startButton();keys.padstart=true}else if(!pressed(9))keys.padstart=false}function ai(bot,dt){bot.think-=dt;if(bot.think>0)return;bot.think=.08+Math.random()*.14;const straight=distClear(bot.x,bot.y,bot.dir,8);let opts=[bot.dir,(bot.dir+1)%4,(bot.dir+3)%4].map(d=>({d,space:distClear(bot.x,bot.y,d,9)}));let best=opts[0];if(straight<=2||Math.random()<.09){opts.sort((a,b)=>(b.space+Math.random()*2)-(a.space+Math.random()*2));best=opts[0]}if(best.space>0)bot.want=best.d}function boom(x,y,color,n=30){camShake=9;for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*270;particles.push({x:OX+(x+.5)*S,y:OY+(y+.5)*S,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.9,color,r:1+Math.random()*4})}}function kill(r){if(!r.alive)return;r.alive=false;boom(r.x,r.y,r.color,35);if(r.id===0){lives--;state=lives>0?'lost':'gameover';flash=lives>0?'YOU CRASHED!':'GAME OVER';flashTime=999}else score+=100}function step(r){if(!r.alive)return;const d=r.want;if((d+2)%4!==r.dir)r.dir=d;let nx=r.x+dirs[r.dir][0],ny=r.y+dirs[r.dir][1];if(!free(nx,ny)){if(r.id===0&&r.ghost>0&&nx>=0&&nx<C&&ny>=0&&ny<R){/* ghost through trails */}else{kill(r);return}}r.px=r.x;r.py=r.y;r.x=nx;r.y=ny;r.trail.push({x:nx,y:ny});if(r.ghost<=0)grid[ny][nx]=r.id;if(r.id===0)score+=2}function update(dt){pollGamepad();clock+=dt;if(state==='playing'){elapsed+=dt;const p=riders[0];let boosting=(boostHeld||keys[' ']||keys['x'])&&boostEnergy>0;let ghosting=(ghostHeld||keys['b'])&&ghostEnergy>0;if(boosting)boostEnergy=Math.max(0,boostEnergy-dt*33);else boostEnergy=Math.min(100,boostEnergy+dt*12);if(ghosting){ghostEnergy=Math.max(0,ghostEnergy-dt*30);p.ghost=.18}else{ghostEnergy=Math.min(100,ghostEnergy+dt*9);p.ghost=Math.max(0,p.ghost-dt)}for(const r of riders){if(!r.alive)continue;if(r.id)ai(r,dt);r.progress+=dt/(r.id===0?(boosting?.075:.14):r.step);let limit=0;while(r.progress>=1&&r.alive&&limit++<4){r.progress--;step(r)}}if(p.alive&&riders.slice(1).every(r=>!r.alive)){state='won';score+=500+round*250;best=Math.max(best,score);flash='ROUND CLEARED!';flashTime=999}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}camShake=Math.max(0,camShake-dt*23);flashTime-=dt}function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}function text(t,x,y,size=20,color='#fff',align='center'){ctx.font=`900 ${size}px system-ui`;ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(t,x,y)}function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function bikeSprite(color){let b=document.createElement('canvas');b.width=96;b.height=128;let g=b.getContext('2d');g.shadowColor=color;g.shadowBlur=16;g.fillStyle='#090e1a';g.beginPath();g.roundRect(35,4,26,33,12);g.fill();g.beginPath();g.roundRect(35,89,26,34,12);g.fill();g.shadowBlur=0;g.fillStyle='#d6eaff';g.fillRect(42,8,12,3);g.fillRect(42,115,12,3);let grad=g.createLinearGradient(12,15,85,105);grad.addColorStop(0,'#fff');grad.addColorStop(.22,color);grad.addColorStop(.55,'#101b34');grad.addColorStop(1,color);g.fillStyle=grad;g.strokeStyle=color;g.lineWidth=3;g.shadowColor=color;g.shadowBlur=13;g.beginPath();g.moveTo(48,11);g.lineTo(66,29);g.lineTo(77,49);g.lineTo(70,75);g.lineTo(65,105);g.lineTo(48,116);g.lineTo(31,105);g.lineTo(26,75);g.lineTo(19,49);g.lineTo(30,29);g.closePath();g.fill();g.stroke();g.shadowBlur=0;g.fillStyle='#071020';g.beginPath();g.ellipse(48,57,15,24,0,0,Math.PI*2);g.fill();g.fillStyle=color;g.beginPath();g.ellipse(48,49,11,13,0,0,Math.PI*2);g.fill();g.fillStyle='#d9fbff';g.beginPath();g.ellipse(48,45,9,5,0,Math.PI,2*Math.PI);g.fill();g.strokeStyle='#efffff';g.lineWidth=3;g.beginPath();g.moveTo(18,67);g.lineTo(35,65);g.moveTo(61,65);g.lineTo(78,67);g.stroke();g.fillStyle='#fff';g.fillRect(42,14,12,7);g.fillStyle=color;g.fillRect(33,95,8,11);g.fillRect(55,95,8,11);return b}let sprites=colors.map(bikeSprite);function drawBike(r){let x=OX+(r.x+.5)*S,y=OY+(r.y+.5)*S;let q=Math.min(1,r.progress);if(r.px!==undefined){x=OX+(r.px+.5+(r.x-r.px)*q)*S;y=OY+(r.py+.5+(r.y-r.py)*q)*S}ctx.save();ctx.translate(x,y);ctx.rotate(r.dir*Math.PI/2);ctx.shadowColor=r.color;ctx.shadowBlur=20;ctx.globalAlpha=r.ghost>0?.65:1;ctx.drawImage(sprites[r.id===0?selected:(selected+r.id)%colors.length],-19,-25,38,50);ctx.restore()}function drawBackground(){let g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#091b3b');g.addColorStop(.4,'#080d22');g.addColorStop(1,'#03050c');rect(0,0,720,720,g);for(const s of backgroundStars){ctx.fillStyle='#6fc9ff55';ctx.fillRect(s.x,s.y,s.r,s.r)}rect(OX-6,OY-6,C*S+12,R*S+12,'#071020');ctx.save();ctx.strokeStyle='#12baff20';ctx.lineWidth=1;for(let x=0;x<=C;x++){ctx.beginPath();ctx.moveTo(OX+x*S,OY);ctx.lineTo(OX+x*S,OY+R*S);ctx.stroke()}for(let y=0;y<=R;y++){ctx.beginPath();ctx.moveTo(OX,OY+y*S);ctx.lineTo(OX+C*S,OY+y*S);ctx.stroke()}ctx.restore();ctx.strokeStyle='#28cfff';ctx.lineWidth=5;ctx.shadowColor='#10bdff';ctx.shadowBlur=18;ctx.strokeRect(OX-5,OY-5,C*S+10,R*S+10);ctx.shadowBlur=0}function drawTrails(){for(const r of riders){if(!r.trail.length)continue;ctx.save();ctx.strokeStyle=r.color;ctx.lineCap='square';ctx.lineJoin='miter';ctx.shadowColor=r.color;ctx.shadowBlur=15;ctx.lineWidth=12;ctx.beginPath();r.trail.forEach((p,i)=>{let x=OX+(p.x+.5)*S,y=OY+(p.y+.5)*S;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff99';ctx.lineWidth=3;ctx.stroke();ctx.restore()}}function render(dt){ctx.save();if(camShake)ctx.translate((Math.random()-.5)*camShake,(Math.random()-.5)*camShake);drawBackground();if(state!=='menu'){drawTrails();for(const r of riders)if(r.alive)drawBike(r);for(const p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}ctx.restore();rect(0,0,720,76,'#04091de8');text('NEON CYCLE RIOT',25,32,24,'#6cecff','left');text(`ROUND ${round}   •   BOTS ${round*2-1}`,25,61,17,'#b4e8ff','left');text(`SCORE ${score}`,690,31,19,'#fff','right');text(`LIVES ${'♥'.repeat(Math.max(0,lives))}`,690,60,19,'#ff6d87','right');if(state==='playing'){rect(32,693,220,9,'#172c42');rect(32,693,220*boostEnergy/100,9,'#ffb72e');rect(468,693,220,9,'#172c42');rect(468,693,220*ghostEnergy/100,9,'#55eaff')}if(state==='menu'){ctx.fillStyle='#020617cc';ctx.fillRect(30,90,660,595);text('ARCADIUM',360,185,33,'#ff5264');ctx.shadowColor='#17dcff';ctx.shadowBlur=26;text('NEON',360,275,83,'#56eaff');ctx.shadowColor='#ff42ce';text('CYCLE RIOT',360,355,63,'#ff73dd');ctx.shadowBlur=0;let r={x:14,y:16,px:14,py:16,progress:0,dir:0,id:0,ghost:0};ctx.save();ctx.translate(360,455);ctx.scale(3.4,3.4);ctx.drawImage(sprites[selected],-19,-25,38,50);ctx.restore();text('REAL BIKES. 90° TURNS. DEADLY TRAILS.',360,550,21,'#d8faff');text('PRESS START TO RIDE',360,619,29,'#ffe456')}if(state==='paused'||state==='won'||state==='lost'||state==='gameover'){ctx.fillStyle='#020718cf';ctx.fillRect(30,90,660,595);let label=state==='paused'?'PAUSED':state==='won'?'ROUND CLEARED!':state==='gameover'?'GAME OVER':'CRASHED!';text(label,360,320,49,state==='won'?'#69ff9e':'#ff5b75');text(state==='won'?`BONUS +${500+round*250}`:state==='lost'?`${lives} LIVES REMAINING`:'',360,370,24,'#bdefff');text(state==='won'?'PRESS START FOR NEXT ROUND':state==='paused'?'PRESS PAUSE TO RESUME':state==='lost'?'PRESS START TO RETRY':'PRESS START FOR NEW GAME',360,445,24,'#fff')}if(flashTime>0&&state==='playing'){ctx.fillStyle='#050b1ac9';ctx.fillRect(55,328,610,75);text(flash,360,380,32,'#a7f5ff')}}function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render(dt);requestAnimationFrame(frame)}const oldStart=startButton;document.getElementById('start').onclick=()=>{if(state==='won'){round++;startRound()}else if(state==='gameover'){round=1;lives=3;score=0;startRound()}else oldStart()};requestAnimationFrame(frame);
})();</script><script>(function(){let previous=-1;setInterval(function(){try{let n=Number(score);if(Number.isFinite(n)&&n>=0&&n!==previous){previous=n;parent.postMessage({arcadium:'og9-score',game:2,score:n},'*')}}catch(e){}},500)})();</script>
