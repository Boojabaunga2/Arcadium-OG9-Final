<!DOCTYPE html><html lang="en"><head><script src="controller.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arcadium • OG9 Tiny Vibes</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030815;color:white;font-family:system-ui,Arial,sans-serif}body{overflow:hidden}button{font:inherit;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 30% -20%,#263c78 0%,transparent 58%),linear-gradient(145deg,#030713,#0b1328 55%,#090716)}header{padding:12px 15px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #f73353;background:#050a19eb}header .logo{font-size:clamp(19px,4vw,32px);font-weight:1000;font-style:italic;letter-spacing:-1px;text-shadow:0 2px #7b0926,0 0 18px #f52258}header .logo b{color:#ff405c}header .sub{font-size:10px;color:#8ee4ff;letter-spacing:2px;font-weight:900}header .og{font-weight:1000;font-size:24px;color:#fff;text-shadow:0 0 12px #42bfff}main{flex:1;min-height:0;overflow:auto;padding:13px}#home h1{margin:3px 0 4px;font-size:21px}#home p{margin:0 0 14px;color:#b4c8e5;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{position:relative;aspect-ratio:0.83;border:2px solid #396394;border-radius:12px;overflow:hidden;background:linear-gradient(150deg,#162a4a,#10132b);padding:0;color:white;text-align:left;box-shadow:0 5px 14px #0007}.tile.selected{border:3px solid #ff3b58;box-shadow:0 0 0 2px #ffc98b,0 0 20px #ff2e5277}.tile img{width:100%;height:100%;object-fit:cover;filter:brightness(.83)}.tile .shade{position:absolute;inset:42% 0 0;background:linear-gradient(transparent,#020714ee 85%)}.tile .title{position:absolute;bottom:18px;left:6px;right:5px;font-weight:1000;font-style:italic;text-shadow:0 2px 4px #000,0 0 8px #000;font-size:clamp(12px,3vw,20px);line-height:1.05}.tile .type{position:absolute;bottom:4px;left:7px;font-size:9px;color:#9fdcff;font-weight:800}.tile .num{position:absolute;top:5px;left:5px;background:#050e23e0;padding:2px 7px;border-radius:6px;font-size:11px}.tile.locked{opacity:.7}.tile.locked:before{content:'★';position:absolute;top:15%;left:33%;font-size:60px;color:#8fdfff;z-index:2;text-shadow:0 0 20px #00b8ff}.detail{display:flex;gap:10px;align-items:center;margin:14px 0 6px;padding:11px;border:1px solid #396b98;border-radius:12px;background:#08152ce8}.detail .desc{flex:1;min-width:0}.detail strong{font-size:18px}.detail small{display:block;color:#9cb9d6;font-size:11px;margin-top:3px}.play{background:linear-gradient(#ff506b,#b00c35);border:2px solid #ffabb5;color:white;border-radius:11px;padding:12px 18px;font-weight:1000}.play:disabled{opacity:.45}.nav{display:flex;gap:8px;padding:9px;border-top:1px solid #254775;background:#060e20}.nav button{flex:1;background:#10223f;color:#d7e9ff;border:1px solid #315d91;border-radius:9px;padding:11px 2px;font-weight:800;font-size:12px}.nav button.active{border-color:#fa4469;background:#761634;color:white}.panel{border:1px solid #315b8c;background:#071429;border-radius:14px;padding:15px;margin:10px 0}.panel h2{margin:0 0 10px;color:#ffe17a}.muted{color:#abc0da;font-size:13px}.rank{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #243954}.rank:nth-child(odd){background:#10213a}.tag{color:#ffe17a;font-size:11px}.gameView{position:fixed;inset:0;background:#03070f;z-index:20;display:none;flex-direction:column}.gameTop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px;background:#09152b;border-bottom:2px solid #f33c59;font-size:12px;font-weight:900}.gameTop button{background:#b71939;border:1px solid #ffc2cb;color:white;border-radius:7px;padding:7px 11px}.gameView iframe{flex:1;border:0;background:#000;width:100%}.notice{background:#2b1b15;color:#ffe8b0;border:1px solid #99602b;padding:10px;border-radius:10px;font-size:12px;line-height:1.45}@media(min-width:800px){#app{max-width:800px;margin:auto;border-left:1px solid #355;border-right:1px solid #355}.tile .title{font-size:22px}}
.gameView .gameTop{display:none!important}.gameView iframe{min-height:0!important;height:100%!important;display:block!important}
</style></head><body><div id="app"><header><div><div class="logo"><b>A</b>RCADIUM</div><div class="sub">TINY VIBES • ARCADE OS PREVIEW</div></div><div class="og">OG<span style="color:#ff445e">9</span></div><div id="profileBar" style="display:flex;gap:8px;align-items:center;justify-content:center;padding:7px;background:#10162a;border-bottom:1px solid #304260;flex-wrap:wrap;font-size:12px"><label for="playerName">PLAYER</label><select id="playerName" style="max-width:145px;background:#101c36;color:white;border:1px solid #5470a3;border-radius:6px;padding:5px"></select><button id="addPlayer" style="background:#23395e;color:white;border:1px solid #5470a3;border-radius:6px;padding:5px">+ PLAYER</button><button id="exportScores" style="background:#23395e;color:white;border:1px solid #5470a3;border-radius:6px;padding:5px">EXPORT</button><button id="importScores" style="background:#23395e;color:white;border:1px solid #5470a3;border-radius:6px;padding:5px">IMPORT</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div></header><main id="screen"></main><div class="nav"><button data-tab="home" class="active">▦ GAMES</button><button data-tab="scores">★ SCORES</button><button data-tab="monthly">▣ MONTHLY</button><button data-tab="rewards">◆ REWARDS</button></div></div><div class="gameView" id="gameView"><div class="gameTop"><button id="back">← OG9 MENU</button><span id="playingTitle"></span><span>HARDWARE CONTROLS</span></div><iframe id="frame" allow="autoplay" title="Arcadium game"></iframe></div><script>
const games=[{"title": "Home Run Derby", "file": "arcadium_home_run_v7_matching_team_colors.html", "cover": "covers/cover0.jpg", "color": "#fa3758", "category": "SPORTS", "ready": true}, {"title": "Gridiron Riot", "file": "gridiron_riot_v16_spaced_defense.html", "cover": "covers/cover1.jpg", "color": "#f7a73b", "category": "SPORTS", "ready": true}, {"title": "Neon Cycle Riot", "file": "neon_cycle_riot_true_tron.html", "cover": "covers/cover2.jpg", "color": "#00d6fc", "category": "ARCADE", "ready": true}, {"title": "Tankageddon", "file": "tankageddon_ground_combat_v2.html", "cover": "covers/cover3.jpg", "color": "#7ce87c", "category": "ARCADE", "ready": true}, {"title": "Galactic Riot", "file": "galactic_riot_balanced_v3.html", "cover": "covers/cover4.jpg", "color": "#a57dff", "category": "ARCADE", "ready": true}, {"title": "Crash Landing", "file": "crash_landing_challenge_v2.html", "cover": "covers/cover5.jpg", "color": "#ffbc61", "category": "SKILL", "ready": true}, {"title": "Rockageddon", "file": "rockageddon_arcadium_collision_fixed.html", "cover": "covers/cover6.jpg", "color": "#ff6b9e", "category": "ARCADE", "ready": true}, {"title": "Brick Riot", "file": "brick_riot_2026_visual_test.html", "cover": "covers/cover7.jpg", "color": "#64f2ce", "category": "ARCADE", "ready": true}, {"title": "Ghost Grab", "file": "ghost_grab.html", "cover": "covers/cover8.jpg", "color": "#7ad7f6", "category": "ARCADE", "ready": true}];let selected=0,tab='home';const screen=document.getElementById('screen');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){screen.innerHTML=`<section id="home"><h1>THE ORIGINAL NINE</h1><p>Pick a game • Play with Mini Vibe buttons • Chase your high score</p><div class="cards">${games.map((x,i)=>`<button class="tile ${i===selected?'selected':''} ${x.ready?'':'locked'}" data-i="${i}" style="border-color:${i===selected?'#ff526d':x.color}">${x.cover?`<img src="${x.cover}" alt="">`:''}<div class="shade"></div><span class="num">${String(i+1).padStart(2,'0')}</span><span class="title">${esc(x.title)}</span><span class="type">${x.ready?esc(x.category):'LEGACY • PORT PENDING'}</span></button>`).join('')}</div><div class="detail"><div class="desc"><strong style="color:${games[selected].color}">${esc(games[selected].title)}</strong><small>${games[selected].ready?'Installed local HTML game • Offline play':'Original MicroPython game • Android port not yet included'}</small></div><button class="play" id="play" ${games[selected].ready?'':'disabled'}>▶ PLAY</button></div><div class="notice">SCOREBOARD BETA: Local personal bests are captured from games and saved on this device. Official online rankings and prizes are not connected.</div></section>`;screen.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;show()});document.getElementById('play').onclick=play}
else if(tab==='scores'){screen.innerHTML=`<div class="panel"><h2>★ MY HIGH SCORES</h2><p class="muted">Each included game currently keeps its own scoring rules. This launcher does not yet receive verified results from those games.</p>${games.map(x=>`<div class="rank"><span>${esc(x.title)}</span><span class="tag">${x.ready?'NOT LINKED':'PORT PENDING'}</span></div>`).join('')}</div>`}
else if(tab==='monthly'){screen.innerHTML=`<div class="panel"><h2>▣ OG9 MONTHLY CHAMPIONSHIP</h2><p class="muted">Competition concept: each game has its own monthly leaderboard; eligible top scores qualify for Arcadium collectible prizes.</p><div class="rank"><span>Competition</span><b>October 2026</b></div><div class="rank"><span>Leaderboard</span><b>NOT LIVE</b></div><div class="rank"><span>Reset schedule</span><b>1st of each month</b></div><div class="rank"><span>Score verification</span><b>NOT CONNECTED</b></div><p class="notice">No player rankings or prize results are fabricated in this preview. The server, account sign-in, anti-cheat checks and official monthly resets must be built before launching prizes.</p></div>`}
else{screen.innerHTML=`<div class="panel"><h2>◆ MY REWARDS</h2><p class="muted">Win a monthly OG9 high-score competition to become eligible for exclusive Arcadium collectibles.</p><div class="rank"><span>Prize entries</span><b>—</b></div><div class="rank"><span>Arcadium credits</span><b>—</b></div><div class="rank"><span>Claimable rewards</span><b>NONE YET</b></div><p class="notice">Rewards and credits shown here are a design preview. No real awards have been issued.</p></div>`}}
function play(){const x=games[selected];if(!x.ready)return;document.getElementById('playingTitle').textContent=x.title;document.getElementById('frame').src='games/'+encodeURIComponent(x.file);document.getElementById('gameView').style.display='flex'}
function back(){document.getElementById('gameView').style.display='none';document.getElementById('frame').src='about:blank'}document.getElementById('back').onclick=back;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show()});document.addEventListener('keydown',e=>{if(document.getElementById('gameView').style.display==='flex'){if(e.key==='Escape'){back()}return}if(tab==='home'){if(e.key==='ArrowRight'){selected=Math.min(8,selected+1);show()}if(e.key==='ArrowLeft'){selected=Math.max(0,selected-1);show()}if(e.key==='ArrowDown'){selected=Math.min(8,selected+3);show()}if(e.key==='ArrowUp'){selected=Math.max(0,selected-3);show()}if(['Enter','a','A'].includes(e.key))play()}});show();

// OG9 Scoreboard Beta: local personal-best telemetry; not an anti-cheat or online ranking.
const STORE='arcadium-og9-scoreboard-beta-v1';
let db;try{db=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
if(!db||!Array.isArray(db.players)||!db.players.length)db={players:['PLAYER 1'],active:'PLAYER 1',records:{},monthRecords:{}};
if(!db.records)db.records={};if(!db.monthRecords)db.monthRecords={};
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){console.warn('Score save unavailable',e)}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profileRefresh(){let el=document.getElementById('playerName');el.innerHTML=db.players.map(n=>'<option value="'+safe(n)+'">'+safe(n)+'</option>').join('');el.value=db.active}
function month(){return new Date().toISOString().slice(0,7)}
function rowsFor(game,monthly){let source=monthly?db.monthRecords[month()]||{}:db.records;return Object.entries(source).map(([name,r])=>({name,value:Number((r||{})[game]||0)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,10)}
function boardMarkup(monthly){return '<div class="panel"><h2>'+ (monthly?'▣ MONTHLY OG9 RECORDS — '+month():'★ OG9 PERSONAL BESTS') +'</h2><p class="muted">'+(monthly?'Local records for this month, on this handheld only.':'Automatically observed in-game scores. Saved on this device, not uploaded or verified for prizes.')+'</p><p class="muted">Current player: <b>'+safe(db.active)+'</b>. Each game has its own scoring system; scores are not comparable across different games.</p>'+games.map((g,i)=>{let rows=rowsFor(i,monthly);return '<div style="margin:12px 0;padding:10px;border:1px solid #344365;border-radius:10px"><strong style="color:'+g.color+'">'+safe(g.title)+'</strong><div style="font-size:13px;margin-top:6px">'+(rows.length?rows.map((r,j)=>'<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+(j+1)+'. '+safe(r.name)+'</span><b>'+r.value.toLocaleString()+'</b></div>').join(''):'No scores recorded yet — play a game!')+'</div></div>'}).join('')+'</div>'}
function rewardsMarkup(){return '<div class="panel"><h2>◆ OG9 COLLECTIBLES</h2><p class="muted">Competition rewards are planned, but not active. Local records are not prize-eligible or cheat-proof. Online synchronization and result verification must be built before official tournaments.</p></div>'}
const originalShow=show;
show=function(){originalShow();if(tab==='scores')screen.innerHTML=boardMarkup(false);if(tab==='monthly')screen.innerHTML=boardMarkup(true);if(tab==='rewards')screen.innerHTML=rewardsMarkup()};
profileRefresh();
document.getElementById('playerName').onchange=e=>{db.active=e.target.value;persist();show()};
document.getElementById('addPlayer').onclick=()=>{let name=prompt('Player name (up to 20 characters)');if(!name)return;name=name.trim().slice(0,20);if(!name)return;if(!db.players.includes(name))db.players.push(name);db.active=name;persist();profileRefresh();show()};
document.getElementById('exportScores').onclick=()=>{let blob=new Blob([JSON.stringify({format:'arcadium-og9-beta',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='arcadium-og9-scores-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importScores').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.format!=='arcadium-og9-beta'||!Array.isArray(v.data?.players)||!v.data.records)throw Error('Not an OG9 score backup');if(!confirm('Replace local profiles and scores with this backup?'))return;db=v.data;persist();profileRefresh();show();alert('OG9 score backup imported')}catch(err){alert('Could not import: '+err.message)}e.target.value=''};
let activeGame=-1,activePlayer='';
const originalPlay=play;play=function(){activeGame=selected;activePlayer=db.active;originalPlay();setTimeout(()=>{try{document.getElementById('frame').contentWindow.focus()}catch(e){}},200)};
const originalBack=back;back=function(){activeGame=-1;originalBack();show()};document.getElementById('back').onclick=back;
window.addEventListener('message',e=>{if(e.source!==document.getElementById('frame').contentWindow)return;let v=e.data;if(!v||v.arcadium!=='og9-score'||v.game!==activeGame)return;let n=Number(v.score);if(!Number.isSafeInteger(n)||n<0||n>1e10)return;let name=activePlayer;if(!db.records[name])db.records[name]={};let changed=false;if(n>Number(db.records[name][activeGame]||0)){db.records[name][activeGame]=n;changed=true}let m=month();if(!db.monthRecords[m])db.monthRecords[m]={};if(!db.monthRecords[m][name])db.monthRecords[m][name]={};if(n>Number(db.monthRecords[m][name][activeGame]||0)){db.monthRecords[m][name][activeGame]=n;changed=true}if(changed)persist()});
show();
</script></body></html>
