.carousel-card{width:min(52vw,36vh,320px)!important;height:min(52vw,36vh,320px)!important;min-width:180px!important;min-height:180px!important;border:3px solid #a9aebb!important;border-radius:5px!important;background:repeating-linear-gradient(135deg,#171018,#171018 6px,#210c13 7px,#210c13 12px)!important;box-shadow:inset 0 0 0 4px #a51935,0 16px 32px #000d!important}
.carousel-card.center{border-color:#dfe2e9!important;box-shadow:0 0 0 4px #ef2849,0 0 26px #ff254b,0 0 65px #bb123b,0 19px 26px #000!important}
.carousel-card:before{content:'✦';position:absolute;top:2%;left:5%;right:5%;color:#e9a1b2;font-size:clamp(13px,3vw,20px);z-index:2;text-shadow:0 0 6px #ff1240}
.carousel-card:after{content:'ARCADIUM';position:absolute;left:0;right:0;top:11%;font-size:clamp(8px,1.4vw,12px);font-weight:900;letter-spacing:.24em;color:#d9dadd;text-shadow:0 2px 5px #000;z-index:2}
.carousel-card img{filter:saturate(1.12) contrast(1.1)!important}
.carousel-card.needs-card img{opacity:.54}
.carousel-card.needs-card .cover-title{font-size:clamp(14px,3vw,23px)!important;background:#120710ce;padding:7px;border-top:2px solid #fb2955}
.carousel-card.center .cover-title{color:#fff;font-weight:1000!important;text-transform:uppercase!important;text-shadow:0 3px 4px black,0 0 12px #fd2349!important}
.carousel-name{font-size:clamp(19px,4vw,29px)!important;text-transform:uppercase;background:linear-gradient(#fafbff,#9b9ca6);color:transparent!important;background-clip:text;filter:drop-shadow(0 2px 1px #401018)}
.carousel-index{font-size:13px!important;color:#fff!important}
.carousel-actions button{font-size:18px!important;padding:9px 56px!important;border:2px solid #fef2f3!important}
.nav{border-top:3px solid #e1e4e9!important}
.nav button{border-width:2px!important;border-style:solid!important;border-color:#9ca3ad!important;border-radius:9px!important}
.nav button.active{border-color:#fff!important;box-shadow:inset 0 0 12px #fc5a79,0 0 17px #ff1b48!important}
.panel,.player-slot,.stat-block,.board-game,.month-hero{background:linear-gradient(140deg,#200914f8,#090b13f5 55%,#240b19e8)!important;border:2px solid #9b7480!important;box-shadow:inset 0 1px 0 #fff4,0 0 10px #ff23472e!important}
.player-slot:before{content:'✦';font-size:20px;color:var(--pc)}
@media (max-height:740px){.cinematic-lockup{height:116px!important}.carousel-viewport{min-height:182px!important}.carousel-card{min-width:165px!important;min-height:165px!important}.profile-mini{max-height:28px!important}}

/* Use entire actual square card, no extra text painted over its art */
.carousel-card img{object-fit:fill!important}
.carousel-card{border:1px solid #d5a1aa!important;border-radius:5px!important;box-shadow:0 0 0 2px #4a1725,0 0 20px #ef2b4a77,0 20px 40px #000e!important}
.carousel-card.center{border:2px solid #ffd8da!important;box-shadow:0 0 0 3px #fb2854,0 0 35px #ff2d59b0,0 23px 44px #000e!important}
.carousel-viewport{background:radial-gradient(ellipse at 50% 67%,#c51c404f,transparent 68%),url('og9-cinematic-bg.jpg') center / cover!important}
/* Allow big visual cards on 720x720 while keeping nav and title visible */
.carousel-card{width:min(60vw,45vh,330px)!important;height:min(60vw,45vh,330px)!important;max-width:330px!important;max-height:330px!important}
</style></head><body><div id="app"><header class="premium-header"><div class="brand-lockup"><img class="arc-logo" src="arcadium-logo.jpg" alt="Arcadium"><div class="brand-caption"><div class="og9-mark"><i>OG</i><b>9</b> <span>TINY VIBES</span></div><small>BITE-SIZE SOCIAL GAMING COMPETITIONS</small></div></div><div id="profileBar" class="profile-mini"><label for="playerName">PLAYER</label><select id="playerName"></select><button id="addPlayer" title="Add local profile">+</button><button id="exportScores" title="Export local score backup">⇩</button><button id="importScores" title="Import local score backup">⇧</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div></header><main id="screen"></main><div class="nav"><button data-tab="home" class="active">🎮 <span>PLAY</span></button><button data-tab="players">♟ <span>PLAYERS</span></button><button data-tab="scores">🏆 <span>SCORES</span></button><button data-tab="monthly">▣ <span>MONTHLY</span></button></div></div><div class="gameView" id="gameView"><div class="gameTop"><button id="back">← OG9 MENU</button><span id="playingTitle"></span><span>HARDWARE CONTROLS</span></div><iframe id="frame" allow="autoplay" title="Arcadium game"></iframe></div><script>
const games=[{"title": "Home Run Derby", "file": "arcadium_home_run_v7_matching_team_colors.html", "cover": "og9-card-0.jpg", "color": "#fa3758", "category": "SPORTS", "ready": true}, {"title": "Gridiron Riot", "file": "gridiron_riot_v16_spaced_defense.html", "cover": "og9-card-1.jpg", "color": "#f7a73b", "category": "SPORTS", "ready": true}, {"title": "Neon Cycle Riot", "file": "neon_cycle_riot_true_tron.html", "cover": "og9-card-2.jpg", "color": "#00d6fc", "category": "ARCADE", "ready": true}, {"title": "Tankageddon", "file": "tankageddon_ground_combat_v2.html", "cover": "og9-card-3.jpg", "color": "#7ce87c", "category": "ARCADE", "ready": true}, {"title": "Galactic Riot", "file": "galactic_riot_balanced_v3.html", "cover": "og9-card-4.jpg", "color": "#a57dff", "category": "ARCADE", "ready": true}, {"title": "Crash Landing", "file": "crash_landing_challenge_v2.html", "cover": "og9-card-5.jpg", "color": "#ffbc61", "category": "SKILL", "ready": true}, {"title": "Rockageddon", "file": "rockageddon_arcadium_collision_fixed.html", "cover": "og9-card-6.jpg", "color": "#ff6b9e", "category": "ARCADE", "ready": true}, {"title": "Brick Riot", "file": "brick_riot_2026_visual_test.html", "cover": "og9-card-7.jpg", "color": "#64f2ce", "category": "ARCADE", "ready": true}, {"title": "Ghost Grab", "file": "ghost_grab.html", "cover": "cinematic-cover8.jpg", "color": "#7ad7f6", "category": "ARCADE", "ready": true}];let selected=0,tab='home';const screen=document.getElementById('screen');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){
  const wrap=i=>(i+games.length)%games.length;
  const cards=[-2,-1,1,2,0].map(offset=>{
    const i=wrap(selected+offset),x=games[i],center=offset===0;
    const position=Math.abs(offset),side=offset<0?-1:1;
    const xpos=position===0?'0px':`calc(${side*position} * min(25vw, 140px))`;
    const scale=center?1:(position===1?.67:.46);
    return `<button class="carousel-card ${center?'center':''}" data-i="${i}" style="--accent:${x.color};--glow:${x.color}55;--x:${xpos};--rot:${-side*(position===1?32:49)}deg;--scale:${scale};--opacity:${position===2?.42:1};--bright:${center?1:.7};z-index:${10-position}" aria-label="${esc(x.title)}${center?' selected':''}"><img src="${x.cover}" alt="${esc(x.title)} game card">${i===8?`<span class="cover-shade"></span><span class="cover-title">${esc(x.title)}</span>`:""}</button>`;
  }).join('');
  screen.innerHTML=`<section id="home"><h1>THE ORIGINAL NINE</h1><p>NINE GAMES · ONE ARCADIUM</p><div class="carousel-viewport" id="carousel"><div class="carousel-stage">${cards}</div><div class="carousel-arrows"><button id="prev" aria-label="Previous game">❮</button><button id="next" aria-label="Next game">❯</button></div></div><div class="carousel-index">${selected+1} / ${games.length}</div><div class="carousel-name" style="text-shadow:0 0 9px ${games[selected].color}">${esc(games[selected].title)}</div><div class="carousel-actions"><button id="play">▶ PLAY</button></div><div class="carousel-help">◀ ▶ BROWSE · A / START PLAY · SWIPE TO BROWSE</div></section>`;
  screen.querySelectorAll('.carousel-card').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===selected)play();else{selected=i;show()}});
  document.getElementById('prev').onclick=()=>{selected=wrap(selected-1);show()};
  document.getElementById('next').onclick=()=>{selected=wrap(selected+1);show()};
  document.getElementById('play').onclick=play;
  const view=document.getElementById('carousel');let sx=null,sy=null;
  view.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  view.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)*1.15){selected=wrap(selected+(dx<0?1:-1));show()}},{passive:true});
}
else if(tab==='scores'){screen.innerHTML=`<div class="panel"><h2>★ MY HIGH SCORES</h2><p class="muted">Each included game currently keeps its own scoring rules. This launcher does not yet receive verified results from those games.</p>${games.map(x=>`<div class="rank"><span>${esc(x.title)}</span><span class="tag">${x.ready?'NOT LINKED':'PORT PENDING'}</span></div>`).join('')}</div>`}
else if(tab==='monthly'){screen.innerHTML=`<div class="panel"><h2>▣ OG9 MONTHLY CHAMPIONSHIP</h2><p class="muted">Competition concept: each game has its own monthly leaderboard; eligible top scores qualify for Arcadium collectible prizes.</p><div class="rank"><span>Competition</span><b>October 2026</b></div><div class="rank"><span>Leaderboard</span><b>NOT LIVE</b></div><div class="rank"><span>Reset schedule</span><b>1st of each month</b></div><div class="rank"><span>Score verification</span><b>NOT CONNECTED</b></div><p class="notice">No player rankings or prize results are fabricated in this preview. The server, account sign-in, anti-cheat checks and official monthly resets must be built before launching prizes.</p></div>`}
else{screen.innerHTML=`<div class="panel"><h2>◆ MY REWARDS</h2><p class="muted">Win a monthly OG9 high-score competition to become eligible for exclusive Arcadium collectibles.</p><div class="rank"><span>Prize entries</span><b>—</b></div><div class="rank"><span>Arcadium credits</span><b>—</b></div><div class="rank"><span>Claimable rewards</span><b>NONE YET</b></div><p class="notice">Rewards and credits shown here are a design preview. No real awards have been issued.</p></div>`}}
function play(){const x=games[selected];if(!x.ready)return;document.getElementById('playingTitle').textContent=x.title;document.getElementById('frame').src='games/'+encodeURIComponent(x.file);document.getElementById('gameView').style.display='flex'}
function back(){document.getElementById('gameView').style.display='none';document.getElementById('frame').src='about:blank'}document.getElementById('back').onclick=back;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;show()});document.addEventListener('keydown',e=>{if(document.getElementById('gameView').style.display==='flex'){if(e.key==='Escape'){back()}return}if(tab==='home'){if(e.key==='ArrowRight'){e.preventDefault();selected=(selected+1)%games.length;show()}if(e.key==='ArrowLeft'){e.preventDefault();selected=(selected+games.length-1)%games.length;show()}if(['Enter',' ','Space','a','A'].includes(e.key)){e.preventDefault();play()}}});show();

// OG9 Scoreboard Beta: local personal-best telemetry; not an anti-cheat or online ranking.
const STORE='arcadium-og9-scoreboard-beta-v1';
let db;try{db=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
if(!db||!Array.isArray(db.players)||!db.players.length)db={players:['PLAYER 1'],active:'PLAYER 1',records:{},monthRecords:{}};
if(!db.records)db.records={};if(!db.monthRecords)db.monthRecords={};
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){console.warn('Score save unavailable',e)}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profileRefresh(){let el=document.getElementById('playerName');el.innerHTML=db.players.map(n=>'<option value="'+safe(n)+'">'+safe(n)+'</option>').join('');el.value=db.active}
function month(){return new Date().toISOString().slice(0,7)}
function rowsFor(game,monthly){let source=monthly?db.monthRecords[month()]||{}:db.records;return Object.entries(source).map(([name,r])=>({name,value:Number((r||{})[game]||0)})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,10)}
function boardMarkup(monthly){return '<div class="panel"><h2>'+ (monthly?'▣ MONTHLY OG9 RECORDS — '+month():'★ OG9 PERSONAL BESTS') +'</h2><p class="muted">'+(monthly?'Local records for this month, on this handheld only.':'Automatically observed in-game scores. Saved on this device, not uploaded or verified for prizes.')+'</p><p class="muted">Current player: <b>'+safe(db.active)+'</b>. Each game has its own scoring system; scores are not comparable across different games.</p>'+games.map((g,i)=>{let rows=rowsFor(i,monthly);return '<div style="margin:12px 0;padding:10px;border:1px solid #344365;border-radius:10px"><strong style="color:'+g.color+'">'+safe(g.title)+'</strong><div style="font-size:13px;margin-top:6px">'+(rows.length?rows.map((r,j)=>'<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+(j+1)+'. '+safe(r.name)+'</span><b>'+r.value.toLocaleString()+'</b></div>').join(''):'No scores recorded yet — play a game!')+'</div></div>'}).join('')+'</div>'}
function rewardsMarkup(){return '<div class="panel"><h2>◆ OG9 COLLECTIBLES</h2><p class="muted">Competition rewards are planned, but not active. Local records are not prize-eligible or cheat-proof. Online synchronization and result verification must be built before official tournaments.</p></div>'}
const originalShow=show;
show=function(){originalShow();if(tab==='scores')screen.innerHTML=boardMarkup(false);if(tab==='monthly')screen.innerHTML=boardMarkup(true);if(tab==='rewards')screen.innerHTML=rewardsMarkup()};
profileRefresh();
document.getElementById('playerName').onchange=e=>{db.active=e.target.value;persist();show()};
document.getElementById('addPlayer').onclick=()=>{let name=prompt('Player name (up to 20 characters)');if(!name)return;name=name.trim().slice(0,20);if(!name)return;if(!db.players.includes(name))db.players.push(name);db.active=name;persist();profileRefresh();show()};
document.getElementById('exportScores').onclick=()=>{let blob=new Blob([JSON.stringify({format:'arcadium-og9-beta',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='arcadium-og9-scores-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('importScores').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.format!=='arcadium-og9-beta'||!Array.isArray(v.data?.players)||!v.data.records)throw Error('Not an OG9 score backup');if(!confirm('Replace local profiles and scores with this backup?'))return;db=v.data;persist();profileRefresh();show();alert('OG9 score backup imported')}catch(err){alert('Could not import: '+err.message)}e.target.value=''};
let activeGame=-1,activePlayer='';
const originalPlay=play;play=function(){activeGame=selected;activePlayer=db.active;originalPlay();setTimeout(()=>{try{document.getElementById('frame').contentWindow.focus()}catch(e){}},200)};
const originalBack=back;back=function(){activeGame=-1;originalBack();show()};document.getElementById('back').onclick=back;
window.addEventListener('message',e=>{if(e.source!==document.getElementById('frame').contentWindow)return;let v=e.data;if(!v||v.arcadium!=='og9-score'||v.game!==activeGame)return;let n=Number(v.score);if(!Number.isSafeInteger(n)||n<0||n>1e10)return;let name=activePlayer;if(!db.records[name])db.records[name]={};let changed=false;if(n>Number(db.records[name][activeGame]||0)){db.records[name][activeGame]=n;changed=true}let m=month();if(!db.monthRecords[m])db.monthRecords[m]={};if(!db.monthRecords[m][name])db.monthRecords[m][name]={};if(n>Number(db.monthRecords[m][name][activeGame]||0)){db.monthRecords[m][name][activeGame]=n;changed=true}if(changed)persist()});
show();

// Arcadium OG9 premium four-tab interface; game and scoring logic above are retained.
(function(){
  const premiumShow=show;
  const colors=[['RED','#fb3558'],['BLUE','#268aff'],['GREEN','#36dc82'],['YELLOW','#ffd74b'],['PINK','#ff70c6'],['WHITE','#e9f0ff']];
  const tidy=x=>safe(x);
  function playersMarkup(){
    const selected=db.active;
    return `<div class="hub-title">SIX PLAYER ROSTER <span class="pill">LOCAL PROFILES</span></div><div class="player-grid">${colors.map(([color,code],i)=>{
      let name=db.players[i]||`PLAYER ${i+1}`;
      return `<div class="player-slot" style="--pc:${code}"><span class="player-face">◉</span><div><strong>${tidy(name)}</strong><small>PLAYER ${i+1} • ${color}</small><br><em>${selected===name?'CURRENT LOCAL PROFILE':'PROFILE SLOT'}</em></div></div>`
    }).join('')}</div><div class="panel"><h2>PLAYER PROFILES</h2><p class="muted">Choose the active local score profile using the PLAYER selector above. Player colors represent roster slots here; admin-locked device colors are managed separately in Arcadium Home.</p><p class="muted">Scores stay on this handheld until exported or synchronized. No online roster connection is claimed.</p></div>`;
  }
  function scoresMarkup(){
    let totals=games.map((g,i)=>rowsFor(i,false).length).reduce((a,b)=>a+b,0);
    let best=Math.max(0,...games.flatMap((g,i)=>rowsFor(i,false).map(r=>r.value)));
    return `<div class="hub-title">ARCADIUM SCORE VAULT <span class="pill">LOCAL RECORDS</span></div><div class="stat-grid"><div class="stat-block"><b>09</b><small>OG GAMES</small></div><div class="stat-block"><b>${totals}</b><small>SCORED ENTRIES</small></div><div class="stat-block"><b>${best.toLocaleString()}</b><small>HIGHEST VALUE*</small></div></div><div class="panel"><p class="muted">*Different games use different scoring systems. Local bests are not official online rankings.</p><div class="board-list">${games.map((g,i)=>{const rows=rowsFor(i,false);return `<div class="board-game"><h3 style="color:${g.color}">${tidy(g.title)}</h3>${rows.length?rows.slice(0,3).map((r,j)=>`<div class="board-row"><span>${j+1} • ${tidy(r.name)}</span><b>${r.value.toLocaleString()}</b></div>`).join(''):`<div class="board-row"><span>NO SCORES RECORDED</span><b>—</b></div>`}</div>`}).join('')}</div></div>`;
  }
  function monthlyMarkup(){
    const m=month();let count=games.map((g,i)=>rowsFor(i,true).length).reduce((a,b)=>a+b,0);
    return `<div class="hub-title">MONTHLY HUB <span class="pill">${m}</span></div><div class="month-hero"><div class="pill" style="display:inline-block">MONTHLY OG9</div><h2>THE ORIGINAL NINE</h2><p>PLAY • IMPROVE • COMPETE</p><p>LOCAL MONTHLY PERSONAL BESTS</p><b style="color:#ffb2c2">${count} RECORD ENTRIES THIS MONTH</b></div><div class="event-panels"><div class="panel"><b>🏆 MONTHLY LEADERS</b><small>${count?`${count} local game-score entries saved`:'No monthly scores yet. Play OG9 to begin.'}</small></div><div class="panel"><b>🎯 NINE-GAME CHALLENGE</b><small>Try every game and beat your previous personal best.</small></div></div><div class="panel"><h2>THIS MONTH'S RECORDS</h2><div class="board-list">${games.map((g,i)=>{let r=rowsFor(i,true);return `<div class="board-row"><span>${tidy(g.title)}</span><b>${r.length?tidy(r[0].name)+' · '+r[0].value.toLocaleString():'—'}</b></div>`}).join('')}</div></div><p class="notice">Official events, prizes, anti-cheat checks and online leaderboards are not enabled. This page shows genuine local score data only.</p>`;
  }
  show=function(){
    if(tab==='players'){
      screen.innerHTML=playersMarkup();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));return;
    }
    premiumShow();
    if(tab==='scores')screen.innerHTML=scoresMarkup();
    if(tab==='monthly')screen.innerHTML=monthlyMarkup();
  };
  // Existing scores/profile actions and existing game controls remain in use.
  show();
})();
</script></body></html>
